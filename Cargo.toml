[package]
name = "amigaplayer-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Amiga music replayers as a library and player: ProTracker and about a hundred other Amiga formats on an emulated Paula, the PC tracker formats of libxmp, AIFF. Deterministic, no audio device needed."
repository = "https://fg.lolo.asia/adminlolo/amigaplayer-rs.git"
readme = "README.md"
keywords = ["amiga", "tracker", "mod", "chiptune", "audio"]
categories = ["multimedia::audio", "emulators"]
exclude = ["tools/", "crates/players-native/gen/"]

[workspace]
# The C API shares the root's lock file and target directory; m68k-rc and players-native
# are path dependencies and so members too. The WebAssembly crate keeps a lock file and
# release profile of its own (panic = abort, LTO), which a workspace member could not.
members = [".", "crates/amigaplayer-capi"]
exclude = ["crates/amigaplayer-wasm"]

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
m68k = "0.14.7"
# The recompiled players and the 68000 runtime they were generated against.
m68k_rc = { package = "m68k-rc", path = "crates/m68k-rc" }
players-native = { path = "crates/players-native" }
sdl3 = { version = "0.20", optional = true }

[features]
default = ["ui", "native", "host-68k"]
# Hosting of the original 68k DeliPlayers / Eagleplayers / DeliGenies (loading them from
# disk, running their code on the emulated 68000, the `Engine` methods that drive them).
# The application needs it; the open-replayer library (`default-features = false`) does not.
host-68k = []
# The SDL3 player window. The library (engine only) builds without it.
ui = ["dep:sdl3", "host-68k"]
# The players recompiled to Rust (crates/players-native/gen), when generated. They
# are derived from the user's player files: leave this off in a build to distribute.
native = ["host-68k", "players-native/gen"]

[lib]
name = "amigaplayer_rs"
path = "src/lib.rs"

[[bin]]
name = "amigaplayer-rs"
path = "src/main.rs"
required-features = ["ui"]
