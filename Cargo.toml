[package]
name = "amigaplayer-rs"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Amiga music replayers as a library and player: ProTracker and about a hundred other Amiga formats on an emulated Paula, the PC tracker formats of libxmp, AIFF. Deterministic, no audio device needed."
repository = "https://fg.lolo.asia/adminlolo/amigaplayer-rs.git"
readme = "README.md"
keywords = ["amiga", "tracker", "mod", "chiptune", "audio"]
categories = ["multimedia::audio", "emulators"]
exclude = ["tools/", "crates/", "docs/", "target-recomp/", "run.sh", "q.py", "two_rows.json", "*.whl", "LICENSE-*.orig"]

# Publishing: four crates, in this order (each `cargo publish` needs the ones before on
# crates.io): crates/m68k-rc, crates/players-native (its generated gen/ is gitignored and never
# ships: the registry is empty), crates/songdb (amigaplayer-songdb: no dependencies, and no
# data), then this one. Users of the library want `default-features = false` (no SDL3, no
# 68k player hosting, no generated players).
[workspace]
# The C API shares the root's lock file and target directory; m68k-rc, players-native and
# songdb are path dependencies and so members too. The WebAssembly crate keeps a lock file and
# release profile of its own (panic = abort, LTO), which a workspace member could not.
members = [".", "crates/amigaplayer-capi", "crates/songdb"]
exclude = ["crates/amigaplayer-wasm"]

[dependencies]
anyhow = "1.0.104"
env_logger = "0.11.11"
log = "0.4.34"
m68k = "0.14.7"
# The recompiled players and the 68000 runtime they were generated against.
m68k_rc = { package = "m68k-rc", path = "crates/m68k-rc", version = "0.1.0" }
players-native = { path = "crates/players-native", version = "0.1.0" }
sdl3 = { version = "0.20", optional = true }
# The reader of audacious-uade's song database (lengths and metadata), vendored in
# crates/songdb. The database itself (CC BY-NC-SA 4.0) is not part of anything here: it is
# read from a directory given at run time.
amigaplayer-songdb = { path = "crates/songdb", version = "0.1.0", optional = true }
# `archives`: LhA (delharc, MIT OR Apache-2.0; its no_std build, so no clock), deflate for zip and
# gzip (flate2 on miniz_oxide, MIT OR Apache-2.0), xz (lzma-rs, MIT). All pure Rust.
delharc = { version = "0.6.2", default-features = false, features = ["lh1", "lz", "lhx"], optional = true }
flate2 = { version = "1.1", optional = true }
lzma-rs = { version = "0.3", optional = true }

[features]
default = ["ui", "native", "host-68k", "archives"]
# Hosting of the original 68k DeliPlayers / Eagleplayers / DeliGenies (loading them from
# disk, running their code on the emulated 68000, the `Engine` methods that drive them).
# The application needs it; the open-replayer library (`default-features = false`) does not.
host-68k = []
# `amigaplayer_rs::songdb`: song lengths and metadata from audacious-uade's song database,
# and `--songdb` / `--stop-at songdb` of amigaplayer-render. Off by default.
songdb = ["dep:amigaplayer-songdb"]
# `amigaplayer_rs::archive`: LhA, zip, gzip, xz and tar archives read in memory, gzip / xz
# wrappers undone by the decrunchers, and the applications' playing of archives (extracted
# into a cache directory). Pure Rust; builds for wasm32-unknown-unknown.
archives = ["dep:delharc", "dep:flate2", "dep:lzma-rs"]
# C64 SID tunes (PSID/RSID files) on an emulated C64 with a real SID chip model:
# `amigaplayer_rs::sid`, a port of NostalgicPlayer's C# ports of libsidplayfp and reSIDfp.
# LICENCE: those two ports are under the GNU General Public License VERSION 2
# (LICENSE-LibSidPlayFp, LICENSE-LibReSidFp), and their files do not say "or any later
# version": a binary or library built with this feature is a GPL-2.0-only work as a whole
# (not GPL-2.0-or-later like the rest). Off by default for that reason. No Commodore ROM
# image is included (see src/sid/mod.rs).
sid = []
# The SDL3 player window. The library (engine only) builds without it.
ui = ["dep:sdl3", "host-68k"]
# The players recompiled to Rust (crates/players-native/gen), when generated. They
# are derived from the user's player files: leave this off in a build to distribute.
native = ["host-68k", "players-native/gen"]

[lib]
name = "amigaplayer_rs"
path = "src/lib.rs"

[[bin]]
name = "amigaplayer-rs"
path = "src/main.rs"
required-features = ["ui"]

# Headless renderer (module to WAV / raw PCM on a file or standard output), no SDL:
#   cargo build --release --no-default-features --features host-68k --bin amigaplayer-render
# With the song database (`--songdb DIR`, `--stop-at songdb`):
#   cargo build --release --no-default-features --features "host-68k songdb" --bin amigaplayer-render
[[bin]]
name = "amigaplayer-render"
path = "src/bin/render.rs"
required-features = ["host-68k"]

[[example]]
name = "make_demo_songdb"
required-features = ["songdb"]

[[example]]
name = "unarchive"
required-features = ["archives"]
