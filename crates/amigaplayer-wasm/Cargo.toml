[package]
name = "amigaplayer-wasm"
description = "The open replayers for the browser: amigaplayer-rs's engine with no 68k player files, behind a small C ABI (see src/lib.rs and amigaplayer.mjs)."
edition = "2024"
version = "0.1.0"
license = "GPL-2.0-or-later"

[lib]
crate-type = ["cdylib"]

[dependencies]
# No SDL window, and none of the players recompiled from the user's own files.
# `archives`: gzip / xz wrappers undone by the decrunchers (pure Rust), and the archive
# readers compiled for wasm32 (lib-check builds them here).
amigaplayer-rs = { path = "../..", default-features = false, features = ["archives"] }

[features]
default = ["custom-modules", "sid"]
# custom modules (`cust.*`, the module's own 68k code) run in the engine's 68k host, as
# natively; `--no-default-features` leaves them out (about 16 KB of the wasm)
custom-modules = ["amigaplayer-rs/custom-modules"]
# C64 SID tunes (PSID / RSID) on the libsidplayfp / reSIDfp ports, as natively (about 128 KB).
# Their files are GPL-2.0-only, so a .wasm built with this feature is a GPL-2.0-only work as a
# whole (the owner's decision, 2026-11-16, for the web page too); without it, GPL-2.0-or-later.
sid = ["amigaplayer-rs/sid"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

# Its own workspace root: it keeps its own Cargo.lock and release profile (see the root Cargo.toml).
[workspace]
